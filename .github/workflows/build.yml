name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu 运行器自带 Android SDK（platforms;android-35、
      # build-tools 35.0.0、licenses 已接受），不需要再装一遍。
      # 原先用的 android-actions/setup-android@v3 只支持 Node 20，被 GitHub
      # 强制升到 Node 24 后直接失败（2026-10-29 实测，13 秒挂在这一步），故移除。
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          java -version

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cervical-guard-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 说明：
      # · 这里只构建 debug 包（无需密钥，任何 fork 都能跑通）
      # · 要出 release 签名包，需把 keystore 存进仓库 Secrets（KEYSTORE_BASE64 等），
      #   再在 workflow 里 base64 -d 还原 —— 本项目暂未启用，个人项目手动构建更省事。
