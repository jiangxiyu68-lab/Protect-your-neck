name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew || true

      - name: Build debug APK
        working-directory: android
        run: |
          if [ -f gradlew ]; then ./gradlew assembleDebug --no-daemon
          else gradle assembleDebug --no-daemon; fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cervical-guard-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 说明：
      # · 这里只构建 debug 包（无需密钥，任何 fork 都能跑通）
      # · 要出 release 签名包，需把 keystore 存进仓库 Secrets（KEYSTORE_BASE64 等），
      #   再在 workflow 里 base64 -d 还原 —— 本项目暂未启用，个人项目手动构建更省事。
